[project]
name = "naturalv2"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "aiofiles>=24.1.0",
    "aiolimiter>=1.2.1",
    "asyncpraw>=7.8.1",
    "causallib>=0.10.0",
    "hydra-core>=1.3.2",
    "litellm>=1.77.1",
    "lxml>=6.0.1",
    "numpy<2.0.0",
    "pandas[parquet,feather,compression]>=2.3.0",
    "presidio-analyzer>=2.2.359",
    "presidio-anonymizer>=2.2.359",
    "scipy>=1.16.0",
    "tenacity>=9.1.2",
    "tqdm>=4.67.1",
    "vllm==0.11.0",
    "wget>=3.2",
]

[dependency-groups]
dev = [
    "ipykernel>=6.30.1",
    "ipywidgets>=8.1.7",
    "pip-audit>=2.9.0",
    "pre-commit>=4.3.0",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.2.0",
    "redis>=6.4.0",
    "ruff>=0.13.0",
    "scalene>=1.5.54",
    "submitit>=1.5.3",
    "weave<0.52.0",
]

[tool.ruff]
include = ["*.py", "pyproject.toml", "*.ipynb"]
line-length = 88

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint]
select = [
    "A", # flake8-builtins
    "B", # flake8-bugbear
    "COM", # flake8-commas
    "C4", # flake8-comprehensions
    "RET", # flake8-return
    "SIM", # flake8-simplify
    "ICN", # flake8-import-conventions
    "Q", # flake8-quotes
    "RSE", # flake8-raise
    "F", # pyflakes
    "I", # isort
    "N", # pep8-naming
    "ERA", # eradicate
    "PL", # pylint
]
fixable = ["A", "B", "COM", "C4", "RET", "SIM", "ICN", "Q", "RSE", "D", "E", "F", "I", "W", "N", "ERA", "PL"]
ignore = [
    "B905", # `zip()` without an explicit `strict=` parameter
    "E501", # line too long
    "D203", # 1 blank line required before class docstring
    "D213", # Multi-line docstring summary should start at the second line
    "PLR2004", # Replace magic number with named constant
    "PLR0913", # Too many arguments
    "COM812", # Missing trailing comma
    "ERA001", # Remove commented out code
]

# Ignore import violations in all `__init__.py` files.
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402", "F401", "F403", "F811"]

[tool.ruff.lint.pep8-naming]
ignore-names = ["X*", "setUp"]

[tool.ruff.lint.isort]
lines-after-imports = 2

[project.scripts]
filter_curate = "naturalv2.cli.filter_curate:main"
estimate_ate = "naturalv2.cli.estimate_ate:main"
create_study = "naturalv2.cli.create_study:main"

[tool.pytest.ini_options]
markers = ["integration_test: marks tests as integration tests"]
asyncio_default_fixture_loop_scope = "function"

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[tool.uv.build-backend]
# use package name as the root directory instead of 'src'
module-name = "naturalv2"
module-root = ""
