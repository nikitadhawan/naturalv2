system_prompt: |-
  You are a clinical data analyst with expertise in completing patient profiles.
  Your task is to construct a complete, clinically plausible patient profile by combining explicit evidence with logical inference and domain knowledge and adhering to given rules.
  Your final answer must always be a single, well-formed JSON object with no additional text, explanations, or formatting.
user_prompt_template: |-
  You will be given a patient report, some known covariate information about them, and some criteria that they are known to satisfy. Complete a comprehensive patient profile by analyzing the provided report, extracting information about a larger set of covariates, and applying logical inference to fill any missing information such that it continues to satisfiy the provided criteria. The following covariate information must be structured into a JSON object.
  {%- for covariate in covariates %}
    {%- if covariate in covariate_desc %}
      - Covariate: '{{ covariate }}'
        Description: {{ covariate_desc[covariate] }}
    {%- else %}
      - Covariate: '{{ covariate }}'
    {%- endif %}
  {%- endfor %}

  **Guidelines:**
  1. Direct Extraction: Extract all explicitly stated values from the given report.
  2. Contextual Inference: For missing values, infer appropriate values via logical deduction using
    - medical terminology and clinical context,
    - inclusion criteria requirements,
    - demographic patterns and correlations,
    - standard clinical practices.
  3. Evidence-Based Imputation: For any remaining missing values,
    - Use most clinically probable values based on available evidence.
    - Consider population norms and medical standards.
    - Ensure internal consistency across all covariates.
    - Maintain compatibility with inclusion criteria.

  **Rules:**
  - Every covariate must have a specific, definitive value.
  - Values must be clinically realistic and internally consistent.
  - If it is possible to represent the value of the covariate numerically, use just a single numerical value. Do not use ranges or categories, even if the description mentions them.
  - If the report provides a specific numerical range, you must calculate and use the average value.
  - Do not include units (like "mg", "days", "years") or any other text in the final numerical value.
  - Profile must satisfy all inclusion criteria.
  - No placeholder values ("Unknown", "N/A", null, etc.) are permitted.
  - Use appropriate data types and formats for each covariate.
  - When multiple plausible values exist, select the most statistically likely option.

  **Report found on {{ source }}:**
  ```
  {{ report }}
  ```

  **Known covariate information about the patient:**
  {%- for covariate in covariate_answers.keys() %}
    - {{ covariate }}: {{ covariate_answers[covariate] }}
  {%- endfor %}

  **Criteria that the patient satisfies:**
  {{ inclusion_criteria }}

  **Response Format:**
  Your JSON must contain exactly these keys with specific values:
  {% for covariate in covariates %}
    {%- if covariate != 'meets_inclusion_criteria' %}
    - '{{ covariate }}'
    {%- endif %}
  {% endfor %}
  Return only a valid JSON object with no additional text, code blocks, or explanations. Unless otherwise specified, use a string for all values.
