system_prompt: |-
  You are a medical assistant aiding a physician.
  I am going to ask you a few multiple choice questions about a report on a patient's experience with a treatment. Please, answer accordingly.
  Your final answer must always be a single, well-formed JSON object with no additional text, explanations, or formatting.
user_prompt_template: |-
  I will give you a report about an individual's experience with a treatment and its effect on the following outcome:
  {{ outcome }}
  {%- if outcome_desc %}
  Description: {{ outcome_desc }}
  {%- endif %}
  {%- if outcome_unit %}
  Units: {{ outcome_unit }}
  {%- endif %}
  {%- if outcome_timeframe %}
  Timeframe: {{ outcome_timeframe }}
  {%- endif %}

  Then, I'll show you a covariate information about this individual.
  Finally, I'll give you some multiple choice question(s) and options to choose from. Pick the right answer(s).

  **Report found on {{ source }}:**

  {{ report }}

  **Covariate information about this individual:**
  {%- for covariate in covariates %}
    - {{ covariate }}: {{ covariate_answers[covariate] }}
  {%- endfor %}

  **Multiple Choice Question(s):**

  Q: Which of the following treatments did the individual described in the report take?
  Options: {{ treatment_options }}

  {%- if outcome_is_binary %}
  Q: Does the individual described in the report count positively towards the {{ outcome }}?
  Options: {{ outcome_options }}
  {%- else %}
  Q: What value would the individual described in the report most likely report for the {{ outcome }}?
  The clinical trial defines this outcome by the measure name, description and timeframe given above. First decide from those whether the trial reports an ABSOLUTE value at follow-up or a CHANGE FROM the individual's pre-treatment BASELINE, and answer on that same basis: for a change, give a signed number (negative = the outcome decreased, positive = it increased, zero = no change). Give a single finite number on the same scale as the description, within the instrument's valid range (for a change, within plus or minus the instrument's width).
  {%- endif %}

  **Response Format:**
  Your JSON must contain exactly these keys:
  - treatment: one of the treatment options above
  - outcome: {% if outcome_is_binary %}one of the outcome options above{% else %}a single number (int or float) estimating the outcome value{% endif %}
  {%- if not outcome_is_binary %}
  - outcome_basis: "absolute" or "change_from_baseline", the basis you answered on
  {%- endif %}
  Return only a valid JSON object with no additional text, code blocks, or explanations.
